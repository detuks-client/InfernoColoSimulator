<div class="panel-section">
  <div class="section-label">Set timer</div>
  <div id="set_timer">
    <div id="set_timer_time">3:30</div>
    <button id="set_timer_button" class="btn btn-secondary btn-sm btn-block">
      Start Set Timer
    </button>
  </div>
</div>

<div class="panel-section">
  <div class="section-label">Wave</div>
  <div class="row">
    <input
      id="waveinput"
      class="input wave-input"
      type="text"
      placeholder="#"
      aria-label="Wave number"
    />
    <button id="playWaveNum" class="btn btn-primary btn-grow">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      New Wave
    </button>
  </div>
  <a id="replayLink" class="btn btn-outline btn-block">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
    Replay Wave
  </a>
  <button id="pauseResumeLink" class="btn btn-outline btn-block">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
    Pause Wave
  </button>
</div>

<div class="panel-section">
  <div class="section-label">Setup</div>
  <select name="loadouts" id="loadouts" class="select" aria-label="Loadout">
    <option value="max_tbow_speed">Max Tbow + Chins</option>
    <option value="max_tbow">Max Tbow</option>
    <option value="max_fbow">Max Fbow</option>
    <option value="budget_fbow">Budget Fbow</option>
    <option value="rcb">RCB</option>
    <option value="zerker">Zerker</option>
    <option value="pure">Pure</option>
    <option value="max_melee">Max Melee (WIP)</option>
  </select>

  <select name="shieldDirection" id="shieldDirection" class="select" aria-label="Zuk shield direction">
    <option value="random">Random Shield Direction</option>
    <option value="west">West Zuk Shield</option>
    <option value="east">East Zuk Shield</option>
  </select>

  <div class="field-row">
    <label class="field-label" for="onTask">On task</label>
    <input type="checkbox" id="onTask" name="onTask" class="switch" />
  </div>
</div>

<div class="panel-section">
  <div class="section-label">Pillars</div>
  <div id="pillars" class="chip-group">
    <input type="checkbox" id="southPillar" name="southPillar" class="chip-input" checked />
    <label class="chip" for="southPillar">S</label>
    <input type="checkbox" id="westPillar" name="westPillar" class="chip-input" checked />
    <label class="chip" for="westPillar">W</label>
    <input type="checkbox" id="northPillar" name="northPillar" class="chip-input" checked />
    <label class="chip" for="northPillar">N</label>
  </div>
</div>

<div class="panel-section">
  <div class="section-label">Practice</div>
  <div class="field-row">
    <label class="field-label" for="waveProgression">Wave progression</label>
    <input type="checkbox" id="waveProgression" name="waveProgression" class="switch" />
  </div>
  <div class="field-row">
    <label class="field-label" for="spawnIndicators">Spawn indicators</label>
    <input type="checkbox" id="spawnIndicators" name="spawnIndicators" class="switch" />
  </div>
  <div class="field-row">
    <label class="field-label" for="displaySetTimer">Set timer below Zuk</label>
    <input type="checkbox" id="displaySetTimer" name="displaySetTimer" class="switch" />
  </div>
</div>

<div class="panel-section">
  <div class="section-label">Custom waves</div>
  <a href="/?wave=0" class="btn btn-outline btn-block">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    Custom Mob Mode
  </a>
  <button id="exportCustomWave" class="btn btn-outline btn-block">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
    Play/Export Wave
  </button>
  <button id="editWave" class="btn btn-outline btn-block">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    Edit Wave
  </button>
</div>
