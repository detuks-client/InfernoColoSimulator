<div class="panel-section">
  <div class="section-label">Attack sequence</div>
  <div class="field-row">
    <label class="field-label" for="use_shield">Shields</label>
    <input type="checkbox" id="use_shield" class="switch" checked="true" />
  </div>
  <div class="field-row">
    <label class="field-label" for="use_spears">Spears</label>
    <input type="checkbox" id="use_spears" class="switch" checked="true" />
  </div>
  <div class="field-row">
    <label class="field-label" for="use_triple">Triple Parry</label>
    <input type="checkbox" id="use_triple" class="switch" checked="true" />
  </div>
  <div class="field-row">
    <label class="field-label" for="use_grapple">Grapple</label>
    <input type="checkbox" id="use_grapple" class="switch" checked="true" />
  </div>
  <div class="field-row">
    <label class="field-label" for="use_phase_transitions">Phase Transitions</label>
    <input type="checkbox" id="use_phase_transitions" class="switch" checked="true" />
  </div>
</div>

<div class="panel-section">
  <div class="section-label">Solar flare</div>
  <select id="solar_flare_level" class="select" aria-label="Solar Flare">
    <option value="0" selected="true">None</option>
    <option value="1">Level 1</option>
    <option value="2">Level 2</option>
    <option value="3">Level 3</option>
  </select>
</div>

<div class="panel-section">
  <div class="section-label">Echo training <span class="section-note">no totems yet</span></div>
  <div class="field-row">
    <label class="field-label" for="echo_max_hp">1725 hp</label>
    <input type="checkbox" id="echo_max_hp" class="switch" />
  </div>
  <div class="field-row">
    <label class="field-label" for="echo_enrage">Pool spawning</label>
    <input type="checkbox" id="echo_enrage" class="switch" />
  </div>
  <div class="field-row">
    <label class="field-label" for="echo_lasers">Following lasers</label>
    <input type="checkbox" id="echo_lasers" class="switch" />
  </div>
</div>
